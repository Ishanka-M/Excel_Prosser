# .streamlit/config.toml  — app root එකේ .streamlit folder එකක් හදලා මේක දාන්න
# (deprecated/unknown key එකක් තිබ්බොත් Streamlit start වෙද්දීම වැටෙනවා, ඒ නිසා minimal + safe keys විතරයි)

[server]
maxUploadSize = 30
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
showErrorDetails = true
